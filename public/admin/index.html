<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content Manager — Gupta Enterprises</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <style>
      /* -------------------------------------------------------------------
         A small helper bar. Enquiry submissions are stored by Netlify Forms,
         not in the repository, so the CMS cannot list them — this points the
         site owner at the right place instead of leaving them hunting.
         ------------------------------------------------------------------- */
      .ge-helper {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: calc(100vw - 24px);
        padding: 10px 12px;
        background: #0b0d10;
        color: #fff;
        border-left: 3px solid #d81f26;
        border-radius: 2px;
        box-shadow: 0 8px 28px rgba(11, 13, 16, 0.35);
        font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      .ge-helper a {
        color: #ff8480;
        text-decoration: underline;
        text-underline-offset: 2px;
        white-space: nowrap;
      }

      .ge-helper a:hover {
        color: #fff;
      }

      .ge-helper__text {
        color: #b4bbc4;
      }

      .ge-helper__close {
        margin-left: 4px;
        padding: 2px 6px;
        background: none;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 2px;
        color: #b4bbc4;
        font: inherit;
        line-height: 1;
        cursor: pointer;
      }

      .ge-helper__close:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
      }

      @media (max-width: 720px) {
        .ge-helper {
          font-size: 12px;
        }
        .ge-helper__text {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Sveltia CMS mounts itself into the document. -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>

    <div class="ge-helper" id="ge-helper" hidden>
      <span class="ge-helper__text">Customer enquiries and RFQs are not stored here —</span>
      <a href="https://app.netlify.com/" target="_blank" rel="noopener noreferrer">
        open the Netlify Forms inbox
      </a>
      <button type="button" class="ge-helper__close" id="ge-helper-close" aria-label="Dismiss">
        Dismiss
      </button>
    </div>

    <script>
      // Show the helper once the CMS has had a moment to render, and remember a
      // dismissal so it does not nag on every visit.
      (function () {
        var helper = document.getElementById('ge-helper');
        var close = document.getElementById('ge-helper-close');
        var KEY = 'ge-admin-helper-dismissed';

        if (!helper || !close) return;

        try {
          if (window.localStorage.getItem(KEY) === '1') return;
        } catch (error) {
          // Private browsing with storage disabled — just show the bar.
        }

        window.setTimeout(function () {
          helper.hidden = false;
        }, 1500);

        close.addEventListener('click', function () {
          helper.hidden = true;
          try {
            window.localStorage.setItem(KEY, '1');
          } catch (error) {
            /* nothing to do */
          }
        });
      })();
    </script>
  </body>
</html>
